concurrency:
  # Non-PR runs need unique groups: a shared group also replaces pending runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

name: ci/cd
on:
  push:
    branches: ['master']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_TOKEN: ${{ secrets.TEST_TOKEN }}

jobs:
  tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@a5f9b05d2d216f63e13859e0d847461041025775
        with:
          go-version: '1.27.x'

      - name: Install ffmpeg
        shell: bash
        run: |
          # Keep the runner's Ubuntu suites and signing key, but bypass cloud
          # mirror stalls and unrelated third-party sources for this install.
          sources="$RUNNER_TEMP/ffmpeg.sources"
          sed -E 's#^URIs:.*#URIs: https://archive.ubuntu.com/ubuntu/#' \
            /etc/apt/sources.list.d/ubuntu.sources > "$sources"
          apt_sources=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_sources[@]}" -o APT::Get::List-Cleanup=false update --error-on=any
          sudo apt-get "${apt_sources[@]}" install -y --no-install-recommends ffmpeg

      - name: Run Go tests
        run: make test-go

  # Runs alongside the tests on master. Images are pushed only under their
  # commit SHA; the release job promotes them once the tests have also passed.
  images:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and smoke-test linux/amd64 images
        run: >-
          make -j2 test-images BUILDX_FLAGS='--platform=linux/amd64
          --label=org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --label=org.opencontainers.image.revision=${{ github.sha }}'

      - name: Push tested images by commit
        run: |
          for app in hypebot hypeserver; do
            image="ghcr.io/sonastea/$app:sha-$GITHUB_SHA"
            docker tag "$app:ci-test" "$image"
            docker push "$image"
          done

  release:
    needs: [tests, images]
    runs-on: ubuntu-24.04
    # Serialize releases so two pushes can't claim the same version.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    outputs:
      deploy: ${{ steps.version.outputs.release == 'true' && steps.version.outputs.latest == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: .github/scripts/release-version.sh | tee -a "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: steps.version.outputs.release == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote tested images
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          for app in hypebot hypeserver; do
            image="ghcr.io/sonastea/$app"
            # Never repoint a published version; a rerun only finishes the release.
            if ! docker buildx imagetools inspect "$image:$VERSION" > /dev/null 2>&1; then
              docker buildx imagetools create --tag "$image:$VERSION" "$image:sha-$GITHUB_SHA"
            fi
            if [[ $LATEST == true ]]; then
              docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
            fi
          done

      - name: Create tag and GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          if ! gh release view "$VERSION" > /dev/null 2>&1; then
            gh release create "$VERSION" --target "$GITHUB_SHA" --generate-notes --latest="$LATEST"
          fi

  deploy-hypebot:
    needs: release
    if: needs.release.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy and run docker container
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          POToken: ${{ secrets.POToken }}
          DISABLED_COMMANDS: ${{ secrets.DISABLED_COMMANDS }}
          CUSTOM_STATUS: ${{ secrets.CUSTOM_STATUS }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            cd $(pwd)/hypebot
            git restore .
            git pull

            if [ ! -z "${{ secrets.DISABLED_COMMANDS }}" ]; then
              if grep -q "DISABLED_COMMANDS" .env; then
                sed -i "s/^DISABLED_COMMANDS=.*/DISABLED_COMMANDS=${{ secrets.DISABLED_COMMANDS }}/" .env
              else
                echo "DISABLED_COMMANDS=${{ secrets.DISABLED_COMMANDS }}" >> .env
              fi
            fi

            docker compose up -d --no-deps --force-recreate --pull always hypebot

  deploy-hypeserver:
    needs: release
    if: needs.release.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy and run docker container
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            cd $(pwd)/hypebot
            git restore .
            git pull
            docker compose up -d --no-deps --force-recreate --pull always hypeserver
